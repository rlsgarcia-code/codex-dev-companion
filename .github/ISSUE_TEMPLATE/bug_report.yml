name: Relatar uma falha
description: Registre uma falha reproduzível sem publicar dados corporativos ou credenciais.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o Local Dev Companion.

        Antes de continuar, gere **Export support bundle** na sidebar e revise o arquivo localmente. Não publique chave, certificado, endpoint privado, nome de projeto, caminho interno, conversa, prompt, código proprietário ou log não sanitizado. Para vulnerabilidades, use o [relatório privado de segurança](https://github.com/rlsgarcia-code/codex-dev-companion/security/advisories/new).

  - type: input
    id: extension-version
    attributes:
      label: Versão da extensão
      description: Informe a versão exibida pelo VS Code, por exemplo 0.11.0.
      placeholder: 0.11.0
    validations:
      required: true

  - type: input
    id: vscode-version
    attributes:
      label: Versão do Visual Studio Code
      placeholder: 1.106.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Sistema e modo de execução
      description: Informe sistema, arquitetura e se o Extension Host é local, Remote SSH, WSL ou Dev Container.
      placeholder: Windows 11 x64, Extension Host local
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - LangChain Agent
        - Deep Agent
        - Ambos
        - Não se aplica
    validations:
      required: true

  - type: input
    id: artifact
    attributes:
      label: Artefato instalado
      description: Informe apenas o nome público do VSIX e, se possível, seu SHA-256.
      placeholder: codex-dev-companion-win32-x64.vsix — SHA-256 ...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado sem dados internos.
      placeholder: A ação permaneceu em andamento depois de...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reprodução mínima
      description: Use um workspace descartável e valores fictícios. Indique a etapa correspondente de docs/CORPORATE-PILOT.md quando aplicável.
      placeholder: |
        1. Abra um workspace descartável.
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true

  - type: textarea
    id: support-bundle
    attributes:
      label: Bundle de suporte revisado
      description: Opcional. Cole somente o JSON gerado por Export support bundle depois de revisá-lo conforme a política da sua empresa.
      render: json

  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmações de privacidade e segurança
      options:
        - label: Revisei o relatório e removi credenciais, certificados, endpoints privados, nomes e caminhos internos, conversas, prompts, código proprietário e logs não sanitizados.
          required: true
        - label: Este relato não descreve uma vulnerabilidade nem contém uma prova de conceito sensível.
          required: true

