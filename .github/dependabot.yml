version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bahia
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      langchain-runtime:
        patterns:
          - "@langchain/*"
          - langchain
          - deepagents
        update-types:
          - minor
          - patch
      build-and-test-tooling:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Bahia
    open-pull-requests-limit: 3
